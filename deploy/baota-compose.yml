services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripbeam
      POSTGRES_USER: tripbeam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - tripbeam_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripbeam -d tripbeam"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3101
      DATABASE_URL: postgres://tripbeam:${POSTGRES_PASSWORD}@postgres:5432/tripbeam
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:?set AMAP_WEB_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEMO_MAP: "false"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PLANNER_INTERNAL_TOKEN: ${PLANNER_INTERNAL_TOKEN:?set PLANNER_INTERNAL_TOKEN}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        VITE_BASE_PATH: ${TRIPBEAM_BASE_PATH:-/tripbeam}
        VITE_API_BASE_URL: ${TRIPBEAM_BASE_PATH:-/tripbeam}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?set VITE_MAP_TILE_URL}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-地图数据服务商}
        VITE_MAP_COORDINATE_SYSTEM: ${VITE_MAP_COORDINATE_SYSTEM:-wgs84}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - api

volumes:
  tripbeam_pg:
