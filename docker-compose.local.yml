services:
  postgres:
    image: postgres:16-alpine
    container_name: tripbeam-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripbeam
      POSTGRES_USER: tripbeam
      POSTGRES_PASSWORD: tripbeam_local_change_me
    ports:
      - "5432:5432"
    volumes:
      - tripbeam-postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripbeam -d tripbeam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tripbeam-postgres-local:
